[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rumbo"
version = "0.1.0"
description = "Intent router for LLM applications with a built-in evaluation harness"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["numpy>=1.26", "httpx>=0.27"]

[project.optional-dependencies]
static = ["model2vec>=0.3"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[project.scripts]
rumbo = "rumbo.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rumbo"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src"]
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
